approvers:
  - U_DEV_APPROVER

slack_channels:
  transfer_reservation: "C_DEV_TRANSFER"
  error: "C_DEV_ERROR"
  approval: "C_DEV_APPROVAL"
  reservation: "C_DEV_RESERVATION"

sync_schedule: "0 8 * * *"

spreadsheet:
  id: "REPLACE_WITH_DEV_SPREADSHEET_ID"
  sheets:
    settlement:
      name: "정산"
      columns:
        "정산기준일": settlement_day
        "이슈사항": issue_type
        "고객명": customer_name
        "예약번호": booking_key
        "업체명1": company_name
        "업체명2(대신배차)": company_sub_name
        "정산기준금액": settlement_cost
        "카모아 부담비용": carmore_cost
        "고객환불금액": user_refund_cost
        "내용": description
        "판매채널": sales_channel
        "스레드 링크": thread_url
        "비고": note
        "처리": status
        "정산완료": settlement_completed
        "작성자": user_name
    issue_log:
      name: "정산이슈로그"
      columns:
        "정산기준일": settlement_day
        "작성자": user_name
        "이슈사항": issue_type
        "고객명": customer_name
        "예약번호": booking_key
        "업체명1": company_name
        "업체명2(대신배차)": company_sub_name
        "정산기준금액": settlement_cost
        "카모아 부담비용": carmore_cost
        "고객환불금액": user_refund_cost
        "판매채널": sales_channel
        "내용": description
        "처리": status
        "승인자": approver_name
        "등록시간": created_at
        "수정시간": updated_at
        "스레드 링크": thread_url
        "비고": note
        "검토자": reviewer_name
        "반려사유": rejection_reason
        "sync_key": sync_key
