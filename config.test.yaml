# 테스트/개발 전용 설정 파일
# 실행 예시:
#   ENVIRONMENT=test uv run python -m app.main
#   ENVIRONMENT=test RUN_REAL_INTEGRATION=1 uv run pytest -m integration_real -v

approvers:
  - U_TEST_APPROVER

slack_channels:
  transfer_reservation: "C_TEST_TRANSFER"
  error: "C_TEST_ERROR"
  approval: "C_TEST_APPROVAL"
  reservation:
    - "C_TEST_RESERVATION"

spreadsheet:
  # 반드시 테스트 전용 스프레드시트 ID로 교체하세요.
  id: "REPLACE_WITH_TEST_SPREADSHEET_ID"
  sheets:
    settlement:
      name: "정산"
      header_row: 1
      columns:
        "정산기준일": settlement_day
        "작성자": user_name
        "이슈사항": issue_type
        "고객명": customer_name
        "예약번호": booking_key
        "업체명1": company_name
        "업체명2(대신배차)": company_sub_name
        "정산기준금액": settlement_cost
        "카모아 부담비용": carmore_cost
        "고객환불금액": user_refund_cost
        "판매채널": sales_channel
        "내용": description
        "처리": status
        "재이관상태": transfer_status
        "승인자": approver_name
        "등록시간": created_at
        "수정시간": updated_at
        "스레드 링크": thread_url
        "비고": note
        "반려자": reviewer_name
        "고객 정보 오류": rejection_reason
        "정산완료": settlement_completed
    issue_log:
      name: "정산이슈로그"
      header_row: 1
      columns:
        "정산기준일": settlement_day
        "작성자": user_name
        "이슈사항": issue_type
        "고객명": customer_name
        "예약번호": booking_key
        "업체명1": company_name
        "업체명2(대신배차)": company_sub_name
        "정산기준금액": settlement_cost
        "카모아 부담비용": carmore_cost
        "고객환불금액": user_refund_cost
        "판매채널": sales_channel
        "내용": description
        "처리": status
        "재이관상태": transfer_status
        "승인자": approver_name
        "등록시간": created_at
        "수정시간": updated_at
        "스레드 링크": thread_url
        "비고": note
        "반려자": reviewer_name
        "고객 정보 오류": rejection_reason
        "sync_key": sync_key
