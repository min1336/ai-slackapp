services:
  slack-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: dev
    container_name: slack-bot-local
    environment:
      - ENVIRONMENT=dev
    env_file:
      - .env
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    ports:
      - "8080:8080"
