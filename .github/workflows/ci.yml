name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit -v

  alembic:
    runs-on: ubuntu-latest
    env:
      ALEMBIC_DATABASE_URL: "sqlite:///test.db"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Check single migration head
        run: |
          heads=$(uv run alembic heads | wc -l)
          echo "Migration heads: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "ERROR: Multiple migration heads detected!"
            uv run alembic heads
            exit 1
          fi

      - name: Run migrations on fresh DB
        run: uv run alembic upgrade head

      - name: Check model-migration consistency
        run: uv run alembic check
